# 라이브 1개 설정 예시 (DESIGN 5.1)
# 사용법: config/ 로 복사해 이름을 <id>.yaml 로 바꾸고 값만 수정한다.
#   cp config.example/ch01.yaml config/ch02.yaml
# 라이브 추가 = 이 파일 1개 + `sudo systemctl enable --now live-audio@ch02 live@ch02`. 코드 수정 없음.

id: ch01                       # 파일명과 같아야 함
name: "Paris Jazz Lounge"
enabled: true

video:
  # 라이브별 비트레이트 (전역 상수 금지). copy 송출이라 실제 송출 비트레이트는 클립 자체의 값이며,
  # 이 값은 클립 검증 경고와 용량 계산에 쓰인다. 4500k/5500k 비교 실험 시 라이브마다 다르게.
  bitrate: 5500k

audio:
  mode: random_norepeat        # random | random_norepeat | sequential | sequential_loop
  norepeat_count: 30
  # 크로스페이드는 0 만 허용: 섞으려면 디코딩→재인코딩이 필요하다 (DESIGN 11-2 위반).
  crossfade: 0
  # Liquidsoap → ffmpeg 로컬 연결 포트 (127.0.0.1 에만 바인드). 라이브마다 달라야 함.
  harbor_port: 8101

# 타깃 시간대 — 반드시 지역명. "UTC-6" 같은 오프셋 숫자 금지 (서머타임에 1시간 어긋남).
timezone: America/Chicago
schedule:
  - { from: "06:00", video: [morning], audio: [upbeat] }
  - { from: "18:00", video: [evening], audio: [chill] }

# 일일 재시작 시각 (위 timezone 기준). 라이브끼리 30초 이상 어긋나야 하며, 겹치면 설정 검증에서 거부된다.
restart_at: "04:17"

stream_key_file: secrets/ch01.key   # 권한 600. 절대 커밋하지 않음

youtube:
  # 미리보기(유튜브 임베드)와 방송 상태 확인용 영상 ID (선택). https://youtu.be/<여기>
  video_id: ""

# output:
#   url: rtmps://a.rtmp.youtube.com/live2   # 생략 시 server.yaml 의 output.default_url
