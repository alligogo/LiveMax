# 서버 공통 설정 예시. install.sh 가 config/server.yaml 로 복사한다 (이미 있으면 덮어쓰지 않음).
# 여기 없는 항목은 코드 기본값(src/livemax/config.py DEFAULT_SERVER)을 따른다.
# 서버 고유값(IP·호스트명·라이브 개수·키)은 코드가 아니라 이 파일과 secrets/ 에만 둔다.

paths:
  media_root: /media           # _incoming/ _rejected/ video/ audio/ 가 이 아래에 생긴다 (같은 디스크여야 함)
  log_dir: /var/log/livemax
  run_dir: /run/livemax
  state_dir: /var/lib/livemax  # concat 목록, 썸네일
  db: /var/lib/livemax/livemax.db

logging:
  level: DEBUG                 # 처음엔 상세하게. 안정화 후 INFO 로

restart:
  min_gap_seconds: 30          # 라이브 간 재시작 최소 간격

watchdog:
  speed_min: 0.97              # 이 미만이 speed_grace_seconds 동안 지속되면 재시작
  speed_grace_seconds: 60
  stall_seconds: 30            # 진행 정지 판정
  max_restarts_per_hour: 6
  youtube_check_seconds: 300   # 유튜브 API 확인 주기 (videos.list = 1 unit)

collector:
  interval_seconds: 10
  network_interface: auto      # auto = 기본 경로 인터페이스

cleanup:
  rejected_days: 7
  incoming_stale_hours: 24
  log_days: 14
  metrics_raw_days: 30
  disk_warn_percent: 80
  disk_emergency_percent: 90

capacity:
  monthly_traffic_tb: 32       # FUP 추정 안전선 — vnstat 실측으로 교정할 것
  port_mbit: 200
  safety_ratio: 0.85

dashboard:
  username: admin
  bind: 127.0.0.1              # 외부 공개는 Caddy(HTTPS)가 담당. 직접 노출하지 않는다
  port: 8080
  domain: ""                   # 예: live1.example.com — 지정하면 install.sh 가 Caddy(Let's Encrypt) 설정
  acme_email: ""

geo:
  enabled: true                # 기본 ON (국내만)
  allowed_countries: [KR]
  mmdb_path: /var/lib/livemax/GeoLite2-Country.mmdb
  fail_open: true

youtube:
  api_key_file: secrets/youtube_api.key   # 없으면 유튜브 상태 확인을 건너뜀
