{% extends "base.html" %}
{% block title %}비밀번호 변경 · LiveMax{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>
  {% if forced %}<p class="flash warn">▲ 설치 시 생성된 초기 비밀번호입니다. 계속하려면 변경해야 합니다.</p>{% endif %}
  <form method="post" action="/settings/password">
    <label>현재 비밀번호 <input name="current" type="password" autocomplete="current-password" required></label>
    <label>새 비밀번호 (12자 이상) <input name="new" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>새 비밀번호 확인 <input name="new2" type="password" autocomplete="new-password" minlength="12" required></label>
    <button class="primary">변경</button>
  </form>
</section>
{% endblock %}
