{% extends "base.html" %}
{% block title %}로그 · LiveMax{% endblock %}
{% block content %}
<section class="card">
  <h1>로그</h1>
  <form method="get" action="/logs" class="row">
    <select name="name">{% for n in names %}<option {{ 'selected' if n == name }}>{{ n }}</option>{% endfor %}</select>
    <input type="number" name="lines" value="{{ lines or 300 }}" min="10" max="3000" step="10" aria-label="줄 수">
    <button>보기</button>
  </form>
  {% if name %}<pre class="log">{{ content }}</pre>{% endif %}
  <p class="muted small">스트림 키는 자동으로 마스킹됩니다.</p>
</section>
{% endblock %}
