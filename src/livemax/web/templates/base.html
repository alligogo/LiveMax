<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">
<title>{% block title %}LiveMax{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if not bare %}
<header class="top">
  <a class="brand" href="/">LiveMax</a>
  <nav>
    <a href="/" class="{{ 'on' if path == '/' }}">모니터링</a>
    <a href="/media/video" class="{{ 'on' if path.startswith('/media/video') }}">영상</a>
    <a href="/media/audio" class="{{ 'on' if path.startswith('/media/audio') }}">음원</a>
    <a href="/live" class="{{ 'on' if path.startswith('/live') }}">스트리밍</a>
    <a href="/settings" class="{{ 'on' if path.startswith('/settings') }}">설정</a>
  </nav>
  <form method="post" action="/logout" class="logout"><button class="link">로그아웃</button></form>
</header>
{% endif %}
<main>
  {% if ok %}<div class="flash ok" role="status">✓ {{ ok }}</div>{% endif %}
  {% if err %}<div class="flash err" role="alert">✕ {{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
