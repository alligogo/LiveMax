{% extends "base.html" %}
{% block title %}로그인 · LiveMax{% endblock %}
{% block content %}
<section class="login card">
  <h1>LiveMax</h1>
  <form method="post" action="/login" autocomplete="on">
    <label>아이디 <input name="username" autocomplete="username" required autofocus></label>
    <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">로그인</button>
  </form>
  <p class="muted small">5회 실패 시 15분간 차단됩니다. 비밀번호 분실: SSH 접속 후 <code>python reset_password.py</code></p>
</section>
{% endblock %}
